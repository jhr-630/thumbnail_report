<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>W컨 썸네일 추이 보고</title>
<style>
  :root{
    --paper:#FBF9F4;
    --paper-deep:#F7F2E8;
    --ink:#2B2D29;
    --ink-soft:#6F7068;
    --pine:#4F7165;
    --pine-deep:#3C5850;
    --tan:#C9976B;
    --tan-soft:#EDDCC3;
    --up:#C0392B;
    --down:#2563AC;
    --flat:#9A9A8E;
    --line:#E7E0D3;
    --card-shadow: 0 1px 0 rgba(43,45,41,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;background:var(--paper);}

  /* Header */
  .head{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:10px;
  }
  .head-title{display:flex;align-items:baseline;gap:12px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.14em;color:var(--pine);
    text-transform:uppercase;border:1px solid var(--pine);
    padding:3px 7px;border-radius:3px;
  }
  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;font-size:28px;margin:0;letter-spacing:-.01em;
  }
  .report-date{
    font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;
    color:var(--ink-soft);letter-spacing:0;white-space:nowrap;
  }
  @media (max-width: 480px){
    h1{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:22px;}
    .report-date{font-size:12px;}
  }
  .subtitle{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .save-state{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--pine);transition:background .2s;}
  .dot.saving{background:var(--tan);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* Tag summary cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:26px;}
  .card{
    position:relative;background:var(--paper-deep);border:1px solid var(--line);
    border-radius:4px;padding:14px 14px 12px;box-shadow:var(--card-shadow);
  }
  .card::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--pine);border-radius:2px;
  }
  .card-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-family:'JetBrains Mono',monospace;}
  .card-value{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin-top:4px;display:flex;align-items:baseline;gap:8px;}
  .card-delta{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;}
  .card-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--flat);}

  /* Report-style card wrapper for major sections */
  .report-card{
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:4px;box-shadow:0 1px 3px rgba(35,38,32,0.05);
  }
  .report-card .table-scroll{border:none;}

  /* Today's change table (per-product, 4 core metrics) */
  #todayChangeTable{border-collapse:collapse;width:100%;min-width:560px;}
  #todayChangeTable thead th{
    background:var(--ink);color:var(--paper);font-family:'JetBrains Mono',monospace;
    font-weight:500;font-size:11px;padding:9px 12px;text-align:right;white-space:nowrap;
  }
  #todayChangeTable thead th.prod-col{text-align:left;position:sticky;left:0;background:var(--ink);}
  #todayChangeTable tbody td{
    padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:13px;white-space:nowrap;
  }
  #todayChangeTable tbody td.prod-col{
    text-align:left;font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;
    position:sticky;left:0;background:#fff;border-right:1px solid var(--line);
  }
  #todayChangeTable tbody tr:nth-child(even) td{background:var(--paper-deep);}
  #todayChangeTable tbody tr:nth-child(even) td.prod-col{background:var(--paper-deep);}
  #todayChangeTable .cell-value{font-weight:600;color:var(--ink);}
  #todayChangeTable .cell-delta{font-size:11px;font-weight:600;margin-left:6px;}
  #todayChangeTable .no-data{color:var(--flat);font-weight:400;}

  /* Analysis comment box under the chart */
  .analysis-box{
    margin-top:14px;background:var(--paper-deep);border-left:3px solid var(--pine);
    border-radius:0 6px 6px 0;padding:14px 18px;font-size:13px;line-height:1.7;color:var(--ink);
  }
  .analysis-box .analysis-title{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;
    color:var(--pine);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;
  }
  .analysis-box b{color:var(--ink);}
  .analysis-box .up{font-weight:700;} .analysis-box .down{font-weight:700;}

  /* Section titles */
  .section-title{
    display:flex;align-items:center;gap:10px;margin:34px 0 12px;flex-wrap:wrap;
  }
  .section-title .num{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--paper);
    background:var(--ink);padding:2px 7px;border-radius:3px;
  }
  .section-title h2{font-family:'Fraunces',serif;font-size:18px;margin:0;font-weight:600;}
  .section-subtitle{
    font-family:'Inter',sans-serif;font-weight:500;font-size:12px;color:var(--ink-soft);
    display:inline-block;
  }
  @media (max-width: 480px){
    .section-title h2{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:16px;}
    .section-subtitle{font-size:11px;white-space:normal;}
  }
  .collapse-toggle{
    font-family:'JetBrains Mono',monospace;font-size:13px;background:none;border:1px solid var(--line);
    color:var(--ink-soft);width:26px;height:26px;border-radius:5px;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;transition:transform .15s;flex-shrink:0;
  }
  .collapse-toggle:hover{background:var(--paper-deep);color:var(--ink);}
  .collapse-toggle.collapsed{transform:rotate(-90deg);}
  .section-title .line{flex:1;height:1px;background:var(--line);}

  /* Toolbar */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  button{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    border:1px solid var(--ink);background:var(--paper);color:var(--ink);
    padding:7px 12px;border-radius:4px;cursor:pointer;transition:all .12s;
  }
  button:hover{background:var(--ink);color:var(--paper);}
  button.primary{background:var(--pine);color:var(--paper);border-color:var(--pine);}
  button.primary:hover{background:var(--pine-deep);}
  button.ghost{border-color:var(--line);color:var(--ink-soft);}
  button.ghost:hover{background:var(--paper-deep);color:var(--ink);}
  button.danger:hover{background:var(--up);border-color:var(--up);}

  /* Today input panel */
  .today-panel{
    background:var(--paper-deep);border:1px solid var(--line);border-radius:6px;padding:16px;
  }
  .today-panel .row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .today-panel select, .today-panel input[type=text]{
    font-family:'JetBrains Mono',monospace;font-size:13px;padding:6px 8px;border:1px solid var(--ink-soft);
    border-radius:4px;background:var(--paper);color:var(--ink);
  }
  .input-grid{display:grid;grid-template-columns:1.2fr .7fr .7fr .7fr .7fr;gap:8px;}
  .input-grid.header{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .input-grid .prod-name{font-size:13px;padding:6px 2px;display:flex;align-items:center;font-weight:600;}
  .input-grid input{
    font-family:'JetBrains Mono',monospace;font-size:13px;padding:6px 8px;
    border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);width:100%;
  }
  .input-grid input:focus{outline:none;border-color:var(--pine);background:#fff;}

  /* Table */
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;}
  table{border-collapse:collapse;width:100%;min-width:720px;}
  thead th{
    position:sticky;top:0;background:var(--ink);color:var(--paper);
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:11px;
    padding:8px 10px;text-align:right;white-space:nowrap;
  }
  thead th.prod-col{text-align:left;position:sticky;left:0;z-index:3;width:150px;min-width:150px;}
  thead th.metric-col{text-align:left;position:sticky;left:150px;z-index:3;width:70px;min-width:70px;border-left:1px solid rgba(244,239,228,0.15);}
  thead th.date-col{border-left:1px solid rgba(244,239,228,0.15);}
  tbody td{
    padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;
  }
  tbody td.prod-col{
    text-align:left;font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;
    position:sticky;left:0;z-index:1;background:var(--paper);border-right:1px solid var(--line);
    width:150px;min-width:150px;white-space:normal;vertical-align:middle;
  }
  tbody td.metric-col{
    text-align:left;position:sticky;left:150px;z-index:1;
    background:var(--paper-deep);border-right:1px solid var(--line);
    width:70px;min-width:70px;font-family:'Inter',sans-serif;font-size:10.5px;
    font-weight:600;color:var(--ink-soft);
  }
  tbody tr.prod-block-start td.prod-col,
  tbody tr.prod-block-start td{ border-top:1.6px solid var(--ink); }
  tbody tr.prod-shade td.prod-col{ background:var(--paper-deep); }
  tbody tr.prod-shade td.metric-col{ background:#EFE7D6; }
  tbody tr.prod-shade td.value-col{ background:#FAF6EC; }
  .metric-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;position:relative;top:-1px;}
  .metric-dot.likes{background:#4F7165;} .metric-dot.ctr{background:#2563AC;}
  .metric-dot.imp{background:#C9976B;} .metric-dot.sales{background:#C0392B;}
  .metric-dot.spend{background:#8A6BAE;} .metric-dot.revenue{background:#6B8E5A;}
  .metric-dot.roas{background:#A57C3C;} .metric-dot.clickRate{background:#5B7B9C;}
  .metric-dot.convRate{background:#B25A78;} .metric-dot.adSales{background:#5C5D54;}
  tbody td.editable{cursor:text;}
  tbody td.editable input{
    width:60px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:right;
    border:1px solid var(--pine);background:#fff;border-radius:3px;padding:3px 4px;color:var(--ink);
  }
  tbody td.editable input:focus{outline:none;border-color:var(--pine);background:#fff;}
  .delta-tag{font-size:10.5px;margin-top:1px;font-weight:600;}
  .metric-sub{font-size:10px;color:var(--ink-soft);font-weight:400;text-transform:none;}
  .rm-col-btn, .rm-row-btn{
    background:none;border:none;color:var(--paper);opacity:.5;font-size:11px;cursor:pointer;padding:0 0 0 6px;
  }
  .rm-col-btn:hover, .rm-row-btn:hover{opacity:1;color:var(--up);}

  /* Chart section */
  .chart-controls{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px;}
  .metric-toggle{display:flex;border:1px solid var(--ink);border-radius:5px;overflow:hidden;}
  .metric-toggle button{border:none;border-radius:0;margin:0;}
  .metric-toggle button.active{background:var(--ink);color:var(--paper);}
  .metric-select{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    border:1px solid var(--ink);background:var(--paper);color:var(--ink);
    padding:7px 10px;border-radius:5px;min-width:170px;cursor:pointer;
  }
  .prod-checks{display:flex;flex-wrap:wrap;gap:6px;max-width:640px;}
  .prod-check{
    font-size:11.5px;padding:5px 9px;border:1px solid var(--line);border-radius:20px;
    cursor:pointer;user-select:none;background:var(--paper-deep);color:var(--ink-soft);
  }
  .prod-check.active{background:var(--pine);color:var(--paper);border-color:var(--pine);}
  .chart-box{
    background:var(--paper-deep);border:1px solid var(--line);border-radius:6px;padding:16px;height:340px;
  }

  /* Tabs */
  .tab-bar{
    display:flex;flex-wrap:nowrap;align-items:stretch;gap:4px;
    border-bottom:2px solid var(--ink);margin-bottom:16px;
    height:42px;max-height:42px;
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .tab-bar::-webkit-scrollbar{height:6px;width:0;}
  .tab-bar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .tab-bar::-webkit-scrollbar-track{background:transparent;}
  .tab-btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
    background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
    padding:0 16px;cursor:pointer;
    color:var(--ink-soft);white-space:nowrap;flex-shrink:0;
    display:flex;align-items:center;height:100%;box-sizing:border-box;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--pine);}
  .tab-btn:hover{color:var(--ink);}
  .tab-pane{display:none;}
  .tab-pane.active{display:block;}

  /* Period (weekly/monthly) stat cards */
  .period-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .period-card{
    background:var(--paper-deep);border:1px solid var(--line);border-radius:6px;padding:12px 14px;
  }
  .period-card .pc-label{font-size:10.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.04em;}
  .period-card .pc-value{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-top:4px;color:var(--ink);}
  .period-card .pc-delta{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;margin-top:3px;}

  /* Report-style insight callout lines (✅ ⚠️ 🔻 style) */
  .insight-lines{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .insight-line{font-size:12.5px;line-height:1.6;padding:8px 12px;border-radius:5px;background:#fff;border:1px solid var(--line);}
  .insight-line.good{border-left:3px solid var(--pine);}
  .insight-line.warn{border-left:3px solid var(--tan);}
  .insight-line.bad{border-left:3px solid var(--up);}

  #weeklyTable, #monthlyTable{border-collapse:collapse;width:100%;min-width:640px;}
  #weeklyTable thead th, #monthlyTable thead th{
    background:var(--ink);color:var(--paper);font-family:'JetBrains Mono',monospace;
    font-weight:500;font-size:11px;padding:8px 10px;text-align:right;white-space:nowrap;
  }
  #weeklyTable thead th:first-child, #monthlyTable thead th:first-child{text-align:left;}
  #weeklyTable tbody td, #monthlyTable tbody td{
    padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap;
  }
  #weeklyTable tbody td:first-child, #monthlyTable tbody td:first-child{
    text-align:left;font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;
  }
  #weeklyTable tbody tr:nth-child(even), #monthlyTable tbody tr:nth-child(even){background:var(--paper-deep);}

  .rank-section-title{
    font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--ink);
    margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line);
  }
  .rank-group-title{
    font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;
  }
  .rank-group-title.good{color:var(--pine);}
  .rank-group-title.bad{color:var(--up);}
  .rank-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width: 900px){ .rank-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width: 540px){ .rank-grid{grid-template-columns:1fr;} }
  .rank-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px;min-width:0;}
  .rank-card-bad{border-color:#E8C3BC;background:#FBF3F1;}
  .rank-title{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.02em;}
  .rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .rank-item{display:flex;flex-direction:column;gap:1px;}
  .rank-item-top{display:flex;align-items:center;gap:7px;font-size:12.5px;}
  .rank-medal{font-size:13px;width:20px;flex-shrink:0;text-align:center;}
  .rank-name{flex:1;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .rank-name.underperform-name{color:var(--up);}
  .soldout-badge{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
    color:var(--ink-soft);background:var(--paper-deep);border:1px solid var(--line);
    border-radius:10px;padding:1px 7px;vertical-align:middle;white-space:nowrap;
  }
  .rank-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--pine);font-weight:700;flex-shrink:0;}
  .rank-card-bad .rank-val{color:var(--up);}
  .rank-subval{font-size:10.5px;color:var(--ink-soft);padding-left:27px;}
  .rank-empty{font-size:12px;color:var(--flat);}


  .helper{font-size:12px;color:var(--ink-soft);margin-top:10px;}
  .empty{padding:30px;text-align:center;color:var(--ink-soft);font-size:13px;}
  ::selection{background:var(--tan-soft);}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="head-title">
      <div>
        <div class="eyebrow">Daily Tracking</div>
        <h1>W컨 썸네일 추이 보고 <span id="reportDate" class="report-date"></span></h1>
        <div class="subtitle">좋아요수 &amp; 광고 클릭수 — 날짜별 추이</div>
        <div class="subtitle" style="margin-top:2px;color:var(--pine);">🔗 이 표는 공유 데이터입니다 — 링크를 가진 모든 사람이 같은 내용을 보고 함께 수정할 수 있어요</div>
      </div>
    </div>
    <div class="save-state"><span class="dot" id="saveDot"></span><span id="saveText">저장됨</span></div>
  </div>

  <div class="section-title"><span class="num">01</span><h2>오늘의 변동사항 <span class="section-subtitle">(금일 오전 9시 기준 / 전일 대비)</span></h2><div class="line"></div></div>
  <div class="report-card">
    <div class="table-scroll"><table id="todayChangeTable"></table></div>
  </div>
  <div class="analysis-box" id="changeComment"></div>

  <div class="section-title"><span class="num">02</span><h2>추이 리포트</h2><div class="line"></div></div>

  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="tabAll">전체 추이</button>
    <button class="tab-btn" data-tab="tabMonthly">월간 추이</button>
    <button class="tab-btn" data-tab="tabWeekly">주간 추이</button>
    <span id="dynamicWeekTabs" style="display:contents;"></span>
  </div>

  <div class="tab-pane active" id="tabAll">
    <div class="report-card" style="padding:18px;margin-bottom:18px;">
      <div id="allTimeCards" class="period-cards"></div>
      <div id="allTimeText" class="analysis-box" style="margin-top:12px;"></div>
      <div class="rank-section-title">전체 기간 제품 랭킹</div>
      <div id="allTimeRanks"></div>
    </div>

    <div class="chart-controls">
      <div>
        <div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">지표</div>
        <select id="metricSelect" class="metric-select">
          <optgroup label="기본 지표">
            <option value="likes">좋아요수</option>
            <option value="ctr">광고 클릭수</option>
            <option value="imp">광고 노출수</option>
            <option value="sales">판매량</option>
          </optgroup>
          <optgroup label="광고 성과">
            <option value="spend">광고비</option>
            <option value="revenue">매출</option>
            <option value="roas">ROAS</option>
            <option value="clickRate">클릭률</option>
            <option value="convRate">전환율</option>
            <option value="adSales">판매수(광고)</option>
          </optgroup>
        </select>
      </div>
      <div>

// 품절 상품 등록부 (기간 기반). 품절 기간이 지나면 재판매로 자동 인식된다.
// - 상품명 옆에는 항상 "품절 이력" 배지를 붙여 히스토리를 보여준다 (표는 제품당 한 줄이라 날짜별로 다르게 못 보여줌).
// - 랭킹/분석 계산에서는 그 기간에 해당하는 날짜만 해당 상품 통계에서 제외한다(기간이 지나면 정상 포함).
const SOLD_OUT_RANGES = {
  '뮤즈 브이넥 탑_(3color)': [
    { startMonth:7, startDay:22, endMonth:7, endDay:31 }
  ]
};
function soldOutRangesFor(product){
  return SOLD_OUT_RANGES[product] || [];
}
function hasSoldOutHistory(product){
  return soldOutRangesFor(product).length > 0;
}
// 특정 (월,일)이 해당 상품의 품절 기간에 포함되는지 확인한다.
function isSoldOutOnDay(product, month, day){
  const ranges = soldOutRangesFor(product);
  if(ranges.length===0) return false;
  const val = month*100 + day;
  return ranges.some(r=>{
    const startVal = r.startMonth*100 + r.startDay;
    const endVal = r.endMonth*100 + r.endDay;
    return val >= startVal && val <= endVal;
  });
}
// "7.22~31" 또는 "7.22~8.3" 형식의 짧은 날짜 구간 텍스트를 만든다.
function compactRangeText(r){
  return (r.startMonth===r.endMonth)
    ? `${r.startMonth}.${r.startDay}~${r.endDay}`
    : `${r.startMonth}.${r.startDay}~${r.endMonth}.${r.endDay}`;
}
function soldOutCompactLabel(product){
  const ranges = soldOutRangesFor(product);
  if(ranges.length===0) return '';
  return `품절 ${compactRangeText(ranges[0])}`;
}
function soldOutBadge(product){
  const label = soldOutCompactLabel(product);
  if(!label) return '';
  return ` <span class="soldout-badge">${label}</span>`;
}
function productLabel(product){
  return `${product}${soldOutBadge(product)}`;
}

function buildDefaultState(){
  return {
    products: [...SEED_DATA.products],
    dates: [...SEED_DATA.dates],
    data: JSON.parse(JSON.stringify(SEED_DATA.data)),
    selectedProduct: SEED_DATA.products[0],
    metric: 'likes',
    chartMode: 'raw'
  };
}

function setSaveState(saving){
  const dot = document.getElementById('saveDot');
  const txt = document.getElementById('saveText');
  if(saving){ dot.classList.add('saving'); txt.textContent = '저장 중...'; }
  else { dot.classList.remove('saving'); txt.textContent = '저장됨'; }
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      state = JSON.parse(res.value);
      // migrate: ensure fields exist
      if(!state.selectedProduct){
        state.selectedProduct = (state.selectedProducts && state.selectedProducts[0]) || state.products[0];
      }
      delete state.selectedProducts;
      if(!state.metric) state.metric = 'likes';
      if(!state.chartMode) state.chartMode = 'raw';
      return;
    }
  }catch(e){ /* no existing key */ }
  state = buildDefaultState();
  await persist(true);
}

async function persist(silent){
  if(!silent) setSaveState(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
    }catch(e){ console.error('저장 실패', e); }
    setSaveState(false);
  }, 350);
}

function fmt(n){ return (n===null||n===undefined||n==='') ? '—' : n; }
function fmtCtr(n){ return (n===null||n===undefined||n==='') ? '—' : Number(n).toLocaleString(); }

function deltaBadge(curr, prev, isPct){
  if(curr===null||curr===undefined||prev===null||prev===undefined) return '';
  const d = Number(curr)-Number(prev);
  if(isNaN(d)) return '';
  const cls = d>0?'up':(d<0?'down':'flat');
  const arrow = d>0?'▲':(d<0?'▼':'—');
  const val = isPct ? Math.abs(d).toFixed(1)+'%p' : Math.abs(d);
  return `<div class="delta-tag ${cls}">${arrow} ${val}</div>`;
}

// metric-aware version: formats the delta according to the metric's kind (원/％p/x/개)
function formatDeltaCore(curr, prev, metric){
  if(curr===null||curr===undefined||prev===null||prev===undefined) return null;
  const d = Number(curr)-Number(prev);
  if(isNaN(d)) return null;
  const kind = (METRIC_INFO[metric] && METRIC_INFO[metric].kind) || 'int';
  const cls = d>0?'up':(d<0?'down':'flat');
  const arrow = d>0?'▲':(d<0?'▼':'—');
  let val;
  if(kind==='currency') val = '₩' + Math.round(Math.abs(d)).toLocaleString();
  else if(kind==='percent') val = (Math.abs(d)*100).toFixed(1)+'%p';
  else if(kind==='roas') val = Math.abs(d).toFixed(1)+'x';
  else val = Math.abs(d).toLocaleString();
  return {cls, arrow, val, raw:d};
}

function deltaBadgeForMetric(curr, prev, metric){
  const c = formatDeltaCore(curr, prev, metric);
  if(!c) return '';
  return `<div class="delta-tag ${c.cls}">${c.arrow} ${c.val}</div>`;
}

function deltaSpanForMetric(curr, prev, metric){
  const c = formatDeltaCore(curr, prev, metric);
  if(!c) return '';
  return `<span class="cell-delta ${c.cls}">${c.arrow} ${c.val}</span>`;
}

/* ---------- Summary cards ---------- */
function lastDateWithMetric(metric){
  for(let i=state.dates.length-1; i>=0; i--){
    const d = state.dates[i];
    if(state.products.some(p=> getMetricValue(state.data[p][d], metric)!==null)) return d;
  }
  return null;
}

const CORE_METRICS = [
  {key:'likes', label:'좋아요수'},
  {key:'ctr', label:'광고 클릭수'},
  {key:'imp', label:'광고 노출수'},
  {key:'sales', label:'판매량'}
];

function renderSummary(){
  const table = document.getElementById('todayChangeTable');

  let thead = '<thead><tr><th class="prod-col">제품명</th>';
  CORE_METRICS.forEach(m=>{
    const d = lastDateWithMetric(m.key);
    thead += `<th>${m.label}${d ? `<br><span style="opacity:.6;font-weight:400;">${d}</span>` : ''}</th>`;
  });
  thead += '</tr></thead>';

  let tbody = '<tbody>';
  state.products.forEach(p=>{
    tbody += `<tr><td class="prod-col">${productLabel(p)}</td>`;
    CORE_METRICS.forEach(m=>{
      const d = lastDateWithMetric(m.key);
      if(!d){ tbody += `<td class="no-data">데이터 없음</td>`; return; }
      const idx = state.dates.indexOf(d);
      const prevD = idx>0 ? state.dates[idx-1] : null;
      const val = getMetricValue(state.data[p][d], m.key);
      const prevVal = prevD ? getMetricValue(state.data[p][prevD], m.key) : null;
      const delta = deltaSpanForMetric(val, prevVal, m.key);
      tbody += `<td><span class="cell-value">${formatMetricValue(val, m.key)}</span> ${delta}</td>`;
    });
    tbody += '</tr>';
  });
  tbody += '</tbody>';

  table.innerHTML = thead + tbody;

  renderChangeComment();
}

// 오늘의 변동사항 표를 바탕으로 어떤 제품의 흐름이 좋았는지 짧은 코멘트를 생성한다.
function renderChangeComment(){
  const container = document.getElementById('changeComment');
  if(!container) return;

  // 판매량은 "오늘 데이터 입력"이 오전 9시 기준이라 당일치가 아직 완결되지 않은 값일 수 있다.
  // 그래서 판매량만은 최신일(오늘)이 아니라 "전날 vs 전전날"을 비교해서 말한다.
  const salesLastDate = lastDateWithMetric('sales');
  const salesIdx = salesLastDate ? state.dates.indexOf(salesLastDate) : -1;
  const salesCurD = salesIdx > 0 ? state.dates[salesIdx-1] : null; // 전날 (완결된 값)
  const salesPrevD = salesIdx > 1 ? state.dates[salesIdx-2] : null; // 전전날

  const results = state.products.map(p=>{
    const rec = {product:p};
    CORE_METRICS.forEach(m=>{
      if(m.key === 'sales'){
        if(!salesCurD || !salesPrevD){ rec.sales = null; return; }
        const val = getMetricValue(state.data[p][salesCurD], 'sales');
        const prevVal = getMetricValue(state.data[p][salesPrevD], 'sales');
        rec.sales = (val!==null && prevVal!==null) ? val - prevVal : null;
        return;
      }
      const d = lastDateWithMetric(m.key);
      if(!d){ rec[m.key] = null; return; }
      const idx = state.dates.indexOf(d);
      const prevD = idx>0 ? state.dates[idx-1] : null;
      const val = getMetricValue(state.data[p][d], m.key);
      const prevVal = prevD ? getMetricValue(state.data[p][prevD], m.key) : null;
      rec[m.key] = (val!==null && prevVal!==null) ? val - prevVal : null;
    });
    return rec;
  });

  const withLikes = results.filter(r=> r.likes!==null);
  const withSales = results.filter(r=> r.sales!==null);

  if(withLikes.length===0 && withSales.length===0){
    container.innerHTML = `<div class="analysis-title">오늘의 코멘트 (전날 대비)</div><div>아직 전날과 비교할 데이터가 충분하지 않습니다.</div>`;
    return;
  }

  const byLikes = [...withLikes].sort((a,b)=> b.likes - a.likes);
  const bySales = [...withSales].sort((a,b)=> b.sales - a.sales);

  const topLikes = byLikes[0];
  // 품절 기간 중의 하락은 "실적 저조"가 아니라 재고 문제이므로 언급 대상에서 제외한다.
  // 단, 품절이 끝나고 재판매 중인 날짜라면 다른 상품과 동일하게 정상적으로 포함한다.
  const likesTodayLabel = lastDateWithMetric('likes');
  const likesTodayInfo = likesTodayLabel ? parseDateInfo(likesTodayLabel) : null;
  const byLikesExcludingSoldOut = byLikes.filter(r=>
    !(likesTodayInfo && isSoldOutOnDay(r.product, likesTodayInfo.month, likesTodayInfo.day))
  );
  const worstLikes = byLikesExcludingSoldOut[byLikesExcludingSoldOut.length-1];
  const risingSales = bySales.filter(r=> r.sales>0);
  const risingBoth = results.filter(r=> r.likes>0 && r.sales>0);

  const sentences = [];

  if(topLikes && topLikes.likes>0){
    sentences.push(`오늘 가장 뚜렷한 상승세를 보인 제품은 <b>${topLikes.product}</b>로, 좋아요수가 전날 대비 <span class="up">▲${topLikes.likes.toLocaleString()}</span> 늘었습니다.`);
  } else {
    sentences.push(`오늘은 전날 대비 좋아요수가 뚜렷하게 늘어난 제품이 없었습니다.`);
  }

  if(risingBoth.length>0){
    const names = risingBoth.slice(0,3).map(r=>`<b>${r.product}</b>`).join(', ');
    sentences.push(`좋아요수와 판매량이 함께 늘어난 제품은 ${names}로, 반응과 실제 구매가 같이 움직이는 흐름을 보였습니다.`);
  }

  if(salesCurD && salesPrevD){
    let totalCur = 0, totalPrev = 0, anySales = false;
    state.products.forEach(p=>{
      const c = getMetricValue(state.data[p][salesCurD], 'sales');
      const pr = getMetricValue(state.data[p][salesPrevD], 'sales');
      if(c!==null){ totalCur += c; anySales = true; }
      if(pr!==null){ totalPrev += pr; }
    });
    if(anySales){
      const diff = totalCur - totalPrev;
      const diffCls = diff>0?'up':(diff<0?'down':'flat');
      const diffArrow = diff>0?'▲':(diff<0?'▼':'—');
      const diffWord = diff>0?'증가':(diff<0?'감소':'변화 없음');
      let saleSentence = `판매량은 <b>${salesCurD}</b> 기준 <b>${totalCur.toLocaleString()}건</b>으로, <b>${salesPrevD}</b> ${totalPrev.toLocaleString()}건 대비 <span class="${diffCls}">${diffArrow}${Math.abs(diff).toLocaleString()}건</span> ${diffWord}했습니다.`;
      if(risingSales.length>0){
        const names = risingSales.slice(0,3).map(r=>`${r.product}(+${r.sales.toLocaleString()})`).join(', ');
        saleSentence += ` 제품별로는 ${names}의 판매량이 늘었습니다.`;
      }
      sentences.push(saleSentence);
    }
  }

  if(worstLikes && worstLikes.likes<0 && worstLikes.product !== (topLikes && topLikes.product)){
    sentences.push(`반면 <b class="underperform-name">${worstLikes.product}</b>는 좋아요수가 <span class="down">▼${Math.abs(worstLikes.likes).toLocaleString()}</span> 줄어 흐름이 꺾인 모습입니다.`);
  }

  container.innerHTML = `<div class="analysis-title">오늘의 코멘트 (전날 대비)</div><div>${sentences.join(' ')}</div>`;
}

const TABLE_METRICS = [
  {key:'likes', label:'좋아요', dotClass:'likes'},
  {key:'ctr', label:'클릭수', dotClass:'ctr'},
  {key:'imp', label:'노출수', dotClass:'imp'},
  {key:'sales', label:'판매량', dotClass:'sales'},
  {key:'spend', label:'광고비', dotClass:'spend'},
  {key:'revenue', label:'매출', dotClass:'revenue'},
  {key:'roas', label:'ROAS', dotClass:'roas'},
  {key:'clickRate', label:'클릭률', dotClass:'clickRate'},
  {key:'convRate', label:'전환율', dotClass:'convRate'},
  {key:'adSales', label:'판매수(광고)', dotClass:'adSales'}
];

function renderTable(){
  const table = document.getElementById('dataTable');
  const dates = state.dates;

  let thead = '<thead><tr><th class="prod-col">제품명</th><th class="metric-col">지표</th>';
  dates.forEach((d)=>{
    thead += `<th class="date-col">${d}<button class="rm-col-btn" title="이 날짜 삭제" data-date="${encodeURIComponent(d)}">✕</button></th>`;
  });
  thead += '</tr></thead>';

  let tbody = '<tbody>';
  state.products.forEach((p, pIdx)=>{
    const shadeClass = (pIdx % 2 === 1) ? ' prod-shade' : '';
    TABLE_METRICS.forEach((m, mIdx)=>{
      const rowClasses = ['prod-block-row' + shadeClass];
      if(mIdx === 0) rowClasses.push('prod-block-start');
      tbody += `<tr class="${rowClasses.join(' ')}">`;
      if(mIdx === 0){
        tbody += `<td class="prod-col" rowspan="${TABLE_METRICS.length}">${productLabel(p)}
          <button class="rm-row-btn" style="color:var(--ink-soft);float:right;" data-prod="${encodeURIComponent(p)}" title="제품 삭제">✕</button>
        </td>`;
      }
      tbody += `<td class="metric-col"><span class="metric-dot ${m.dotClass}"></span>${m.label}</td>`;
      dates.forEach((d,i)=>{
        const entry = state.data[p][d] || {};
        const prevD = i>0 ? dates[i-1] : null;
        const prevEntry = prevD ? (state.data[p][prevD] || {}) : {};
        const val = entry[m.key];
        const prevVal = prevEntry[m.key];
        const delta = deltaBadgeForMetric(val, prevVal, m.key);
        tbody += `<td class="editable value-col" data-prod="${encodeURIComponent(p)}" data-date="${encodeURIComponent(d)}" data-metric="${m.key}">
          <div>${formatMetricValue(val, m.key)}</div>
          ${delta}
        </td>`;
      });
      tbody += '</tr>';
    });
  });
  tbody += '</tbody>';

  table.innerHTML = thead + tbody;

  // 제품명·지표 칸은 왼쪽에 고정돼 있으니, 날짜 칸은 항상 가장 최근(당일)이 보이도록
  // 스크롤을 오른쪽 끝으로 맞춘다.
  const scrollBox = table.closest('.table-scroll');
  if(scrollBox){
    requestAnimationFrame(()=>{ scrollBox.scrollLeft = scrollBox.scrollWidth; });
  }

  // inline edit on cell click — single value per cell now
  table.querySelectorAll('td.editable').forEach(td=>{
    td.addEventListener('click', ()=>{
      if(td.querySelector('input')) return;
      const prod = decodeURIComponent(td.dataset.prod);
      const date = decodeURIComponent(td.dataset.date);
      const metric = td.dataset.metric;
      const kind = (METRIC_INFO[metric] && METRIC_INFO[metric].kind) || 'int';
      const entry = state.data[prod][date] || {};
      const current = entry[metric];
      const displayVal = (current!==null && current!==undefined && kind==='percent') ? (current*100) : current;
      const step = (kind==='percent' || kind==='roas') ? '0.1' : '1';
      td.innerHTML = `<input type="number" step="${step}" class="edit-val" value="${displayVal ?? ''}">`;
      const input = td.querySelector('.edit-val');
      input.focus();
      input.select();
      function commit(){
        if(!state.data[prod][date]) state.data[prod][date] = {likes:null, ctr:null, imp:null, sales:null, spend:null, revenue:null, roas:null, clickRate:null, convRate:null, adSales:null};
        let newVal = input.value===''? null : Number(input.value);
        if(newVal!==null && kind==='percent') newVal = newVal/100;
        state.data[prod][date][metric] = newVal;
        persist();
        renderAll(true);
      }
      input.addEventListener('keydown', ev=>{ if(ev.key==='Enter') commit(); });
      input.addEventListener('blur', ()=> setTimeout(()=>{ if(!td.contains(document.activeElement)) commit(); },120));
    });
  });

  table.querySelectorAll('.rm-col-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const date = decodeURIComponent(btn.dataset.date);
      if(!confirm(`"${date}" 날짜를 삭제할까요? 해당 날짜의 모든 데이터가 사라집니다.`)) return;
      state.dates = state.dates.filter(d=>d!==date);
      state.products.forEach(p=>{ delete state.data[p][date]; });
      persist();
      renderAll();
    });
  });
  table.querySelectorAll('.rm-row-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const prod = decodeURIComponent(btn.dataset.prod);
      if(!confirm(`"${prod}" 제품을 삭제할까요?`)) return;
      state.products = state.products.filter(p=>p!==prod);
      delete state.data[prod];
      if(state.selectedProduct === prod){
        state.selectedProduct = state.products[0] || null;
      }
      persist();
      renderAll();
    });
  });
}

/* ---------- Chart (hand-drawn SVG, no external library) ---------- */


const METRIC_INFO = {
  likes:     { label: '좋아요수',      kind: 'int'  },
  ctr:       { label: '광고 클릭수',    kind: 'int'  },
  imp:       { label: '광고 노출수',    kind: 'int'  },
  sales:     { label: '판매량',        kind: 'int'  },
  spend:     { label: '광고비',        kind: 'currency' },
  revenue:   { label: '매출',          kind: 'currency' },
  roas:      { label: 'ROAS',         kind: 'roas' },
  clickRate: { label: '클릭률',        kind: 'percent' },
  convRate:  { label: '전환율',        kind: 'percent' },
  adSales:   { label: '판매수(광고)',   kind: 'int'  }
};

function getMetricValue(entry, metric){
  if(!entry) return null;
  const v = entry[metric];
  return (v===undefined) ? null : v;
}

function metricLabel(metric){
  return (METRIC_INFO[metric] && METRIC_INFO[metric].label) || metric;
}

function formatMetricValue(v, metric){
  if(v===null || v===undefined || v==='') return '—';
  const kind = (METRIC_INFO[metric] && METRIC_INFO[metric].kind) || 'int';
  if(kind==='currency') return '₩' + Math.round(v).toLocaleString();
  if(kind==='percent') return (v*100).toFixed(1) + '%';
  if(kind==='roas') return Number(v).toFixed(1) + 'x';
  return Number(v).toLocaleString();
}

// 각 지표는 실제로 값이 있는 날짜만 x축에 넣는다.
// - 좋아요수: 7/18 오픈전·2시간후·12시간후 스냅샷은 값이 있으니 그대로 보이고,
//   광고/판매 집계 전용인 "7월 18일" 칸은 좋아요수 값이 없어서 자동으로 빠진다.
// - 클릭수/노출수/판매량: 오픈전/2시간후/12시간후 스냅샷은 값이 없어서 자동으로 빠지고,
//   "7월 18일", "7월 19일" 처럼 실제 값이 있는 날짜만 남는다.
function getChartDates(metric){
  return state.dates.filter(d=>
    state.products.some(p=>{
      const v = getMetricValue(state.data[p][d], metric);
      return v !== null && v !== undefined;
    })
  );
}

function renderChart(){
  const container = document.getElementById('trendChart');
  const metric = state.metric;
  const p = state.selectedProduct;
  const isGrowth = state.chartMode === 'growth';

  if(!p || !state.products.includes(p)){
    container.innerHTML = '<div class="empty">표시할 제품이 없습니다. 제품을 추가하거나 선택해주세요.</div>';
    return;
  }

  const color = PALETTE[state.products.indexOf(p) % PALETTE.length];
  const dates = getChartDates(metric);

  const rawValues = dates.map(d=> getMetricValue(state.data[p][d], metric));
  // 증감률 모드: 각 지점을 고정된 기준일이 아니라 "전날"과 비교한다.
  const values = isGrowth
    ? rawValues.map((v,i)=>{
        if(i===0) return null; // 첫 지점은 비교할 전날이 없음
        const prevV = rawValues[i-1];
        if(v===null || prevV===null || prevV===0) return null;
        return ((v - prevV) / prevV) * 100;
      })
    : rawValues;

  const valid = values.filter(v=> v!==null && !isNaN(v));
  if(valid.length === 0){
    container.innerHTML = `<div class="empty">"${p}"의 ${metricLabel(metric)} 데이터가 아직 없습니다. 위 입력 패널에서 값을 넣어보세요.</div>`;
    return;
  }

  let min = Math.min(...valid);
  let max = Math.max(...valid);
  if(!isGrowth) min = Math.min(0, min); // raw counts: always show from zero baseline
  if(min === max){ min -= 1; max += 1; }
  const pad = (max-min) * 0.12;
  min -= pad; max += pad;
  if(isGrowth && min > 0) min = -pad || -1; // keep zero-line visible in growth mode when all positive

  const W = 900, H = 320;
  const padL = 56, padR = 20, padT = 18, padB = 56;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const n = dates.length;

  const xAt = (i)=> n<=1 ? padL + plotW/2 : padL + (i*(plotW/(n-1)));
  const yAt = (v)=> padT + (max - v) / (max - min) * plotH;

  // grid lines (5 horizontal bands) + y labels
  const GRID_STEPS = 4;
  let gridLines = '';
  for(let i=0;i<=GRID_STEPS;i++){
    const v = min + (max-min)*i/GRID_STEPS;
    const y = yAt(v);
    const label = isGrowth ? `${v>0?'+':''}${v.toFixed(1)}%` : formatMetricValue(v, metric);
    gridLines += `
      <line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E7E0D3" stroke-width="1"/>
      <text x="${padL-8}" y="${y+4}" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#6F7068" text-anchor="end">${label}</text>
    `;
  }

  // zero baseline line, emphasized in growth mode
  let zeroLine = '';
  if(isGrowth && min < 0 && max > 0){
    const y0 = yAt(0);
    zeroLine = `<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="#2B2D29" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  }

  // x-axis labels (rotated for space)
  let xLabels = '';
  dates.forEach((d,i)=>{
    const x = xAt(i);
    xLabels += `<text x="${x}" y="${H-padB+18}" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#6F7068" text-anchor="end" transform="rotate(-38 ${x} ${H-padB+18})">${d}</text>`;
  });

  // path segments (break across gaps in data)
  let pathD = '';
  let drawing = false;
  dates.forEach((d,i)=>{
    const v = values[i];
    if(v===null || isNaN(v)){ drawing = false; return; }
    const x = xAt(i), y = yAt(v);
    pathD += (drawing ? ` L ${x} ${y}` : `M ${x} ${y}`);
    drawing = true;
  });

  // points + tooltips
  let points = '';
  dates.forEach((d,i)=>{
    const v = values[i];
    if(v===null || isNaN(v)) return;
    const x = xAt(i), y = yAt(v);
    const displayVal = isGrowth ? `${v>0?'+':''}${v.toFixed(1)}%` : formatMetricValue(rawValues[i], metric);
    points += `
      <circle cx="${x}" cy="${y}" r="4" fill="${color}" stroke="#FBF9F4" stroke-width="1.4">
        <title>${d} · ${displayVal}</title>
      </circle>`;
  });

  const svg = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
      <text x="${padL}" y="12" font-family="Fraunces, serif" font-size="13" font-weight="600" fill="#2B2D29">${p} — ${metricLabel(metric)}${isGrowth ? ` (전날 대비 증감률)` : ''}</text>
      ${gridLines}
      ${zeroLine}
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      ${points}
      ${xLabels}
    </svg>
  `;
  container.innerHTML = svg;

}

// 예약판매(예발) 이력 등록부. 품절과는 무관한 별개의 안내 문구다.
// 이 상품이 품절됐었다는 뜻이 아니라, 해당 월에 예약판매 기간이 있었다는 참고 정보일 뿐이다.
const PRE_ORDER_HISTORY = {
  '에어 시어 윈드브레이커_SAND IVORY': { month: 7 }
};
function preOrderHistoryLabel(product){
  const info = PRE_ORDER_HISTORY[product];
  if(!info) return '';
  return ` (${info.month}월 예발 이력 있음)`;
}

// 그래프 상품 선택 칩에 붙일 안내 문구. 품절 이력과 예약판매 이력은 서로 다른 정보이므로 각각 표시한다.
function chipHistorySuffix(product){
  let suffix = '';
  if(soldOutRangesFor(product).length > 0){
    suffix += ` (${soldOutCompactLabel(product)})`;
  }
  suffix += preOrderHistoryLabel(product);
  return suffix;
}

function renderProdChecks(){
  const box = document.getElementById('prodChecks');
  box.innerHTML = state.products.map(p=>{
    const active = state.selectedProduct === p;
    const soldOutSuffix = chipHistorySuffix(p);
    return `<div class="prod-check ${active?'active':''}" data-prod="${encodeURIComponent(p)}">${p}${soldOutSuffix}</div>`;
  }).join('');
  box.querySelectorAll('.prod-check').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const p = decodeURIComponent(chip.dataset.prod);
      state.selectedProduct = p;
      persist();
      renderProdChecks();
      renderChart();
    });
  });
}

/* ---------- 전체/월간/주간(+주차별) 탭 ---------- */
let activeTabId = 'tabAll';

function switchTab(tabId){
  activeTabId = tabId;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tabId));
  document.querySelectorAll('.tab-pane').forEach(p=> p.classList.toggle('active', p.id===tabId));

document.getElementById('tabBar').addEventListener('click', (e)=>{

  if(!btn) return;

function parseDateInfo(label){
  const m = label.match(/(\d+)월\s*(\d+)일/);
  if(!m) return null;
  return {month:+m[1], day:+m[2]};
}

// 날짜 라벨들을 "달력상 하루" 단위로 묶고, 그 날의 좋아요 라벨 / 광고·판매 라벨을 찾아둔다.
// - 좋아요수: 같은 날짜에 여러 스냅샷이 있으면(7/18 오픈전·2시간후·12시간후처럼) 실제 값이 있는 가장 마지막 스냅샷을 사용
// - 광고/판매 지표: "n월 n일" 형태의 일 단위 집계 칸을 사용
function buildDayLabelInfo(){
  const dayMap = new Map();
  state.dates.forEach(d=>{
    const info = parseDateInfo(d);
    if(!info) return;
    const key = `${info.month}-${info.day}`;
    if(!dayMap.has(key)) dayMap.set(key, {month:info.month, day:info.day, labels:[]});
    dayMap.get(key).labels.push(d);
  });

  const days = [...dayMap.values()].sort((a,b)=> a.month-b.month || a.day-b.day);

  return days.map(({month,day,labels})=>{
    const plain = `${month}월 ${day}일`;
    let likesLabel = null;
    for(let i=labels.length-1; i>=0; i--){
      if(state.products.some(p=> getMetricValue(state.data[p][labels[i]], 'likes') !== null)){
        likesLabel = labels[i];
        break;
      }
    }
    const adLabel = labels.includes(plain) ? plain : null;
    return {month, day, label: plain, likesLabel, adLabel};
  });
}

function buildDailyTotals(dayInfo){
  return dayInfo.map(({month,day,label,likesLabel,adLabel})=>{
    let likes=0, likesCount=0;
    let ctr=0, imp=0, sales=0, spend=0, revenue=0, adSales=0, anyAd=false;

    state.products.forEach(p=>{
      const lv = getMetricValue(state.data[p][likesLabel], 'likes');
      if(lv!==null){ likes+=lv; likesCount++; }
      if(adLabel){
        const c = state.data[p][adLabel] || {};
        if(typeof c.ctr==='number'){ ctr+=c.ctr; anyAd=true; }
        if(typeof c.imp==='number') imp+=c.imp;
        if(typeof c.sales==='number') sales+=c.sales;
        if(typeof c.spend==='number') spend+=c.spend;
        if(typeof c.revenue==='number') revenue+=c.revenue;
        if(typeof c.adSales==='number') adSales+=c.adSales;
      }
    });

    return {
      month, day, label,
      likesTotal: likesCount>0 ? likes : null,
      ctr: anyAd?ctr:null, imp: anyAd?imp:null, sales: anyAd?sales:null,
      spend: anyAd?spend:null, revenue: anyAd?revenue:null, adSales: anyAd?adSales:null
    };
  });
}

// 여러 날짜(하루치 합산본)를 한 구간(주/월)으로 요약한다.
// 좋아요는 "증가분"(구간 마지막 날 누적치 - 첫날 누적치)으로, 나머지는 구간 내 합계로 계산한다.
function summarizePeriod(chunk, label){
  const first = chunk[0], last = chunk[chunk.length-1];

  // 좋아요는 구간의 첫날/마지막날이 아니라, 구간 내에서 실제로 좋아요 값이 있는
  // 가장 이른 날과 가장 늦은 날을 기준으로 증가분을 계산한다.
  let firstLikes=null, lastLikes=null;
  chunk.forEach(d=>{
    if(d.likesTotal!=null){
      if(firstLikes===null) firstLikes = d.likesTotal;
      lastLikes = d.likesTotal;
    }
  });
  const likesGrowth = (firstLikes!==null && lastLikes!==null) ? (lastLikes-firstLikes) : null;

  let ctr=0, imp=0, sales=0, spend=0, revenue=0, adSales=0, any=false;
  chunk.forEach(d=>{
    if(d.ctr!=null){ ctr+=d.ctr; any=true; }
    if(d.imp!=null) imp+=d.imp;
    if(d.sales!=null) sales+=d.sales;
    if(d.spend!=null) spend+=d.spend;
    if(d.revenue!=null) revenue+=d.revenue;
    if(d.adSales!=null) adSales+=d.adSales;
  });

  return {
    label, from: first.label, to: last.label,
    likesGrowth,
    ctr: any?ctr:null, imp: any?imp:null, sales: any?sales:null,
    spend: any?spend:null, revenue: any?revenue:null, adSales: any?adSales:null,
    roas: (any && spend>0) ? (revenue/spend) : null,
    clickRate: (any && imp>0) ? (ctr/imp) : null,
    convRate: (any && ctr>0) ? (adSales/ctr) : null
  };
}

// 월요일~일요일 기준으로 "그 달의 몇 주차"인지 계산한다.
// (1일이 포함된 주가 1주차, 이후 월요일이 시작될 때마다 주차 +1)
const REPORT_YEAR = 2026; // 날짜 라벨에 연도가 없어 현재 캠페인 연도를 고정값으로 사용
function getMonthWeekIndex(month, day){
  const firstOfMonth = new Date(REPORT_YEAR, month-1, 1);
  let firstWeekday = firstOfMonth.getDay(); // Sun=0..Sat=6
  firstWeekday = (firstWeekday + 6) % 7;    // Mon=0..Sun=6 로 변환
  return Math.floor((firstWeekday + (day - 1)) / 7) + 1;
}

function buildWeeklyBuckets(dayInfo, dailyTotals){
  const groups = new Map(); // key "month-weekIdx"
  dayInfo.forEach((d,i)=>{
    if(!d) return;
    const weekIdx = getMonthWeekIndex(d.month, d.day);
    const key = `${d.month}-${weekIdx}`;
    if(!groups.has(key)) groups.set(key, {month:d.month, weekIdx, idxs:[]});
    groups.get(key).idxs.push(i);
  });

  return [...groups.values()]
    .sort((a,b)=> a.month-b.month || a.weekIdx-b.weekIdx)
    .map(g=>{
      const chunk = g.idxs.map(i=> dailyTotals[i]);
      const dayInfoChunk = g.idxs.map(i=> dayInfo[i]);
      const label = `${g.month}월 ${g.weekIdx}주차`;
      const summary = summarizePeriod(chunk, label);
      summary.dayInfo = dayInfoChunk;
      summary.month = g.month;
      summary.weekIdx = g.weekIdx;
      summary.tabId = `tabWeek_${g.month}_${g.weekIdx}`;
      return summary;
    });
}

function buildMonthlyBuckets(dayInfo, dailyTotals){
  const groups = new Map();
  dailyTotals.forEach((d,i)=>{
    if(!groups.has(d.month)) groups.set(d.month, {chunk:[], dayInfoChunk:[]});
    groups.get(d.month).chunk.push(d);
    groups.get(d.month).dayInfoChunk.push(dayInfo[i]);
  });
  return [...groups.entries()].sort((a,b)=>a[0]-b[0])
    .map(([month, {chunk, dayInfoChunk}])=>{
      const summary = summarizePeriod(chunk, `${month}월`);
      summary.dayInfo = dayInfoChunk;
      return summary;
    });
}

// 특정 기간(dayInfo 배열)에 대해 제품별 좋아요 증가·클릭·판매·매출·광고비·ROAS·클릭 대비 판매량(%)을 계산한다.
// null/0/누락 데이터가 있어도 예외가 발생하지 않도록 방어적으로 처리한다.
function computeProductPeriodStats(dayInfoChunk){
  if(!Array.isArray(dayInfoChunk)) dayInfoChunk = [];
  return state.products.map(p=>{
    // 이 상품의 품절 기간에 해당하는 날짜는 통계에서 제외한다(품절 이후 재판매 시점부터는 정상 포함).
    const validChunk = dayInfoChunk.filter(di=> di && !isSoldOutOnDay(p, di.month, di.day));

    let firstLikes=null, lastLikes=null;
    validChunk.forEach(di=>{
      if(!di) return;
      const v = di.likesLabel ? getMetricValue((state.data[p]||{})[di.likesLabel], 'likes') : null;
      if(v!==null && v!==undefined){
        if(firstLikes===null) firstLikes=v;
        lastLikes=v;
      }
    });
    const likesGrowth = (firstLikes!==null && lastLikes!==null) ? (lastLikes-firstLikes) : null;

    let clicks=0, sales=0, spend=0, revenue=0, anyAd=false;
    validChunk.forEach(di=>{
      if(!di || !di.adLabel) return;
      const c = (state.data[p] && state.data[p][di.adLabel]) || {};
      if(typeof c.ctr==='number'){ clicks+=c.ctr; anyAd=true; }
      if(typeof c.sales==='number') sales+=c.sales;
      if(typeof c.spend==='number') spend+=c.spend;
      if(typeof c.revenue==='number') revenue+=c.revenue;
    });

    // 클릭 대비 판매량 = 판매수량 ÷ 광고 클릭수 × 100 (%). 클릭수가 0/없으면 계산하지 않는다(오류 방지).
    const salesPerClick = (anyAd && clicks > 0) ? (sales / clicks) * 100 : null;

    return {
      product:p, likesGrowth,
      clicks: anyAd?clicks:null, sales: anyAd?sales:null,
      spend: anyAd?spend:null, revenue: anyAd?revenue:null,
      roas: (anyAd && spend>0) ? (revenue/spend) : null,
      salesPerClick
    };
  });
}

function rankTop(list, key, n, ascending){
  const filtered = (list||[]).filter(r=> r && r[key]!==null && r[key]!==undefined && !isNaN(r[key]));
  filtered.sort((a,b)=> ascending ? a[key]-b[key] : b[key]-a[key]);
  return filtered.slice(0, n);
}

const RANK_METRIC_DEFS = [
  {key:'roas', title:'ROAS', fmt:v=> v.toFixed(1)+'x'},
  {key:'likesGrowth', title:'좋아요 증가량', fmt:v=> (v>=0?'+':'')+v.toLocaleString()},
  {key:'sales', title:'판매수량', fmt:v=> v.toLocaleString()+'건'},
  {key:'salesPerClick', title:'클릭 대비 판매량', fmt:v=> v.toFixed(1)+'%'}
];

// 개별 랭킹 카드 하나(우수 TOP3 또는 저조 BOTTOM3)를 만든다.
// 저조(isBad) 카드는 상품명을 빨간색으로 표시하고, 판매수량이 주 지표가 아니면 보조 정보로 판매수량을 함께 보여준다.
// 순위(1위·2위·3위)는 항상 세로로 정렬된다.
function renderRankCard(title, items, key, formatFn, isBad){
  if(!items || items.length===0){
    return `<div class="rank-card${isBad?' rank-card-bad':''}"><div class="rank-title">${title}</div><div class="rank-empty">데이터 없음</div></div>`;
  }
  const medals = ['🥇','🥈','🥉'];
  const rows = items.map((it,i)=>{
    const nameClass = isBad ? 'rank-name underperform-name' : 'rank-name';
    let valText = '데이터 없음';
    try{ valText = formatFn(it[key]); }catch(e){ valText = '데이터 없음'; }
    const subval = (key!=='sales' && it.sales!==null && it.sales!==undefined)
      ? `<div class="rank-subval">판매수량 ${it.sales.toLocaleString()}건</div>` : '';
    return `<li class="rank-item">
      <div class="rank-item-top"><span class="rank-medal">${medals[i]||(i+1)+'.'}</span><span class="${nameClass}">${productLabel(it.product)}</span><span class="rank-val">${valText}</span></div>
      ${subval}
    </li>`;
  }).join('');
  return `<div class="rank-card${isBad?' rank-card-bad':''}"><div class="rank-title">${title}</div><ol class="rank-list">${rows}</ol></div>`;
}

// ROAS/좋아요증가/판매수량/클릭대비판매량 4개 지표를 "우수 TOP3 한 줄(4장) + 저조 BOTTOM3 한 줄(4장)"로
// 명확히 구역을 나눠 렌더링한다. 전체/월간/주간/주차별 탭 어디서나 이 함수 하나로 동일한 레이아웃을 쓴다.
// 품절 기간의 날짜는 computeProductPeriodStats에서 이미 그 상품 통계에서 제외되므로,
// 품절 기간만 걸친 구간은 자동으로 랭킹에서 빠지고, 재판매 이후 구간은 정상적으로 포함된다.
function buildRankGridHTML(dayInfoChunk){
  if(!dayInfoChunk || dayInfoChunk.length===0){
    return `<div class="empty">표시할 데이터가 없습니다.</div>`;
  }
  const stats = computeProductPeriodStats(dayInfoChunk);

  const topCards = RANK_METRIC_DEFS.map(m=>
    renderRankCard(`${m.title} TOP3`, rankTop(stats, m.key, 3, false), m.key, m.fmt, false)
  ).join('');
  const bottomCards = RANK_METRIC_DEFS.map(m=>
    renderRankCard(`${m.title} 저조 BOTTOM3`, rankTop(stats, m.key, 3, true), m.key, m.fmt, true)
  ).join('');

  return `
    <div class="rank-group-title good">우수 상품 TOP 3</div>
    <div class="rank-grid">${topCards}</div>
    <div class="rank-group-title bad">저조 상품 BOTTOM 3</div>
    <div class="rank-grid">${bottomCards}</div>
  `;
}

// ROAS/좋아요증가/판매수량/클릭대비판매량 4개 지표 각각의 우수 TOP3 + 저조 BOTTOM3, 총 8개 카드를 지정된 컨테이너에 렌더링한다.
function renderRankGrid(containerId, dayInfoChunk){
  const box = document.getElementById(containerId);
  if(!box) return;
  box.innerHTML = buildRankGridHTML(dayInfoChunk);
}

function periodValueStr(v, metric){
  return formatMetricValue(v, metric);
}

function buildPeriodCardsHTML(curr, prev){
  const cardDefs = [
    {label:`좋아요 증가 · ${curr.label}`, val: curr.likesGrowth, prevVal: prev? prev.likesGrowth: null, metric:'likes'},
    {label:`총 노출수`, val: curr.imp, prevVal: prev? prev.imp: null, metric:'imp'},
    {label:`총 클릭수`, val: curr.ctr, prevVal: prev? prev.ctr: null, metric:'ctr'},
    {label:`총 판매량`, val: curr.sales, prevVal: prev? prev.sales: null, metric:'sales'},
    {label:`총 광고비`, val: curr.spend, prevVal: prev? prev.spend: null, metric:'spend'},
    {label:`총 매출`, val: curr.revenue, prevVal: prev? prev.revenue: null, metric:'revenue'},
    {label:`ROAS`, val: curr.roas, prevVal: prev? prev.roas: null, metric:'roas'},
  ];
  return cardDefs.map(c=>{
    const delta = (c.val!=null && c.prevVal!=null) ? deltaSpanForMetric(c.val, c.prevVal, c.metric) : '';
    return `<div class="period-card">
      <div class="pc-label">${c.label}</div>
      <div class="pc-value">${periodValueStr(c.val, c.metric)}</div>
      <div class="pc-delta">${delta || '<span style="color:var(--flat);">전 구간 데이터 없음</span>'}</div>
    </div>`;
  }).join('');
}

// 리포트 느낌의 짧은 인사이트 문구 (✅ 양호 / ⚠️ 주의 / 🔻 하락)
function buildInsightLinesHTML(curr, prev){
  const lines = [];
  if(prev){
    if(curr.revenue!=null && prev.revenue!=null && prev.revenue>0){
      const pct = ((curr.revenue-prev.revenue)/prev.revenue*100);
      if(pct>=0) lines.push({cls:'good', text:`✅ 매출이 이전 구간 대비 ${pct.toFixed(1)}% 늘었습니다 (${periodValueStr(prev.revenue,'revenue')} → ${periodValueStr(curr.revenue,'revenue')}).`});
      else lines.push({cls:'bad', text:`🔻 매출이 이전 구간 대비 ${Math.abs(pct).toFixed(1)}% 줄었습니다 (${periodValueStr(prev.revenue,'revenue')} → ${periodValueStr(curr.revenue,'revenue')}).`});
    }
    if(curr.roas!=null && prev.roas!=null){
      if(curr.roas < prev.roas) lines.push({cls:'warn', text:`⚠ ROAS가 ${prev.roas.toFixed(1)}x → ${curr.roas.toFixed(1)}x로 낮아졌습니다.`});
      else lines.push({cls:'good', text:`✅ ROAS가 ${prev.roas.toFixed(1)}x → ${curr.roas.toFixed(1)}x로 개선됐습니다.`});
    }
    if(curr.likesGrowth!=null && prev.likesGrowth!=null){
      if(curr.likesGrowth < prev.likesGrowth) lines.push({cls:'warn', text:`⚠ 좋아요 증가폭이 이전 구간(+${prev.likesGrowth.toLocaleString()}) 대비 이번엔 +${curr.likesGrowth.toLocaleString()}로 둔화됐습니다.`});
      else lines.push({cls:'good', text:`✅ 좋아요 증가폭이 이전 구간보다 커졌습니다 (+${prev.likesGrowth.toLocaleString()} → +${curr.likesGrowth.toLocaleString()}).`});
    }
  } else {
    lines.push({cls:'warn', text:`⚠ 아직 비교할 이전 구간 데이터가 없어 증감은 다음 구간부터 표시됩니다.`});
  }
  return lines.map(l=> `<div class="insight-line ${l.cls}">${l.text}</div>`).join('');
}

function renderPeriodCards(containerId, periods, insightsId){
  const container = document.getElementById(containerId);
  const insightsBox = document.getElementById(insightsId);
  if(periods.length===0){
    container.innerHTML = `<div class="empty">아직 표시할 데이터가 없습니다.</div>`;
    insightsBox.innerHTML = '';
    return;
  }
  const curr = periods[periods.length-1];
  const prev = periods.length>1 ? periods[periods.length-2] : null;

  container.innerHTML = buildPeriodCardsHTML(curr, prev);
  insightsBox.innerHTML = buildInsightLinesHTML(curr, prev);
}

function renderPeriodTable(tableId, periods){
  const table = document.getElementById(tableId);
  let thead = `<thead><tr><th>구간</th><th>기간</th><th>좋아요 증가</th><th>노출수</th><th>클릭수</th><th>클릭률</th><th>판매량</th><th>광고비</th><th>매출</th><th>ROAS</th></tr></thead>`;
  let tbody = '<tbody>';
  [...periods].reverse().forEach(p=>{
    tbody += `<tr>
      <td>${p.label}</td>
      <td>${p.from===p.to? p.from : p.from+' ~ '+p.to}</td>
      <td>${p.likesGrowth!=null ? (p.likesGrowth>=0?'+':'')+p.likesGrowth.toLocaleString() : '—'}</td>
      <td>${formatMetricValue(p.imp,'imp')}</td>
      <td>${formatMetricValue(p.ctr,'ctr')}</td>
      <td>${formatMetricValue(p.clickRate,'clickRate')}</td>
      <td>${formatMetricValue(p.sales,'sales')}</td>
      <td>${formatMetricValue(p.spend,'spend')}</td>
      <td>${formatMetricValue(p.revenue,'revenue')}</td>
      <td>${p.roas!=null ? p.roas.toFixed(1)+'x' : '—'}</td>
    </tr>`;
  });
  tbody += '</tbody>';
  table.innerHTML = thead + tbody;
}

function renderPeriodReports(){
  const dayInfo = buildDayLabelInfo();
  const dailyTotals = buildDailyTotals(dayInfo);
  const weekly = buildWeeklyBuckets(dayInfo, dailyTotals);
  const monthly = buildMonthlyBuckets(dayInfo, dailyTotals);

  renderPeriodCards('weeklyCards', weekly, 'weeklyInsights');
  renderPeriodTable('weeklyTable', weekly);
  renderRankGrid('weeklyRanks', weekly.length ? weekly[weekly.length-1].dayInfo : null);

  renderPeriodCards('monthlyCards', monthly, 'monthlyInsights');
  renderPeriodTable('monthlyTable', monthly);
  renderRankGrid('monthlyRanks', monthly.length ? monthly[monthly.length-1].dayInfo : null);

  renderFullPeriodAnalysis(dayInfo);
  renderWeeklyTabs(weekly);
}

// "전체 추이" 탭 상단에 전체 기간 요약 카드 + 분석 문구 + 랭킹을 보여준다.
function renderFullPeriodAnalysis(dayInfo){
  const cardsBox = document.getElementById('allTimeCards');
  const textBox = document.getElementById('allTimeText');
  const ranksBox = document.getElementById('allTimeRanks');
  if(!cardsBox || !textBox || !ranksBox) return;

  if(!dayInfo || dayInfo.length===0){
    cardsBox.innerHTML = `<div class="empty">표시할 데이터가 없습니다.</div>`;
    textBox.innerHTML = '';
    ranksBox.innerHTML = '';
    return;
  }

  const dailyTotals = buildDailyTotals(dayInfo);
  const full = summarizePeriod(dailyTotals, '전체 기간');
  cardsBox.innerHTML = buildPeriodCardsHTML(full, null);

  const from = dayInfo[0].label, to = dayInfo[dayInfo.length-1].label;
  const likesTxt = full.likesGrowth!=null ? `좋아요는 총 <b>+${full.likesGrowth.toLocaleString()}</b> 늘었고, ` : '';
  const salesTxt = full.sales!=null ? `총 판매량은 <b>${full.sales.toLocaleString()}건</b>, ` : '';
  const revenueTxt = full.revenue!=null ? `총 매출은 <b>${formatMetricValue(full.revenue,'revenue')}</b>` : '';
  const roasTxt = full.roas!=null ? `, 전체 기간 ROAS는 <b>${full.roas.toFixed(1)}x</b>였습니다.` : '.';
  textBox.innerHTML = `<div class="analysis-title">전체 기간 분석 (${from} ~ ${to})</div><div>${likesTxt}${salesTxt}${revenueTxt}${roasTxt}</div>`;

  renderRankGrid('allTimeRanks', dayInfo);
}

// 데이터가 존재하는 주(월~일 기준)마다 "7월 N주차" 탭을 자동으로 만든다.
function renderWeeklyTabs(weekly){
  const tabBox = document.getElementById('dynamicWeekTabs');
  const paneBox = document.getElementById('dynamicWeekPanes');
  if(!tabBox || !paneBox) return;

  if(weekly.length===0){
    tabBox.innerHTML = '';
    paneBox.innerHTML = '';
    return;
  }

  // "전날/전주 대비" 비교는 시간순(오래된 주 -> 최신 주)으로 계산해야 하므로,
  // weekly는 오름차순 그대로 두고 먼저 (week, prevWeek) 짝을 만든다.
  const pairs = weekly.map((week, i)=> ({ week, prevWeek: i>0 ? weekly[i-1] : null }));

  // 화면에 보여줄 탭 순서는 "실제 시작 날짜" 기준 내림차순(최신 주차가 가장 앞)으로 정렬한다.
  // 탭 이름(문자열) 비교가 아니라 그 주의 첫 날짜(월/일)를 직접 비교한다.
  function weekStartKey(w){
    const first = w && w.dayInfo && w.dayInfo[0];
    return first ? (first.month*100 + first.day) : -1;
  }
  pairs.sort((a,b)=> weekStartKey(b.week) - weekStartKey(a.week));

  let tabsHTML = '';
  let panesHTML = '';

  pairs.forEach(({week, prevWeek})=>{
    const isActive = activeTabId === week.tabId;
    tabsHTML += `<button class="tab-btn${isActive?' active':''}" data-tab="${week.tabId}">${week.label}</button>`;

    const cardsHTML = buildPeriodCardsHTML(week, prevWeek);
    const insightsHTML = buildInsightLinesHTML(week, prevWeek);
    const rankHTML = buildRankGridHTML(week.dayInfo);

    panesHTML += `
      <div class="tab-pane${isActive?' active':''}" id="${week.tabId}">
        <div class="report-card" style="padding:18px;">
          <div class="period-cards">${cardsHTML}</div>
          <div class="insight-lines">${insightsHTML}</div>
          <div class="rank-section-title">${week.label} (${week.from} ~ ${week.to}) 제품 랭킹</div>
          ${rankHTML}
        </div>
      </div>`;
  });

  tabBox.innerHTML = tabsHTML;
  paneBox.innerHTML = panesHTML;
}

  renderChart();
}
document.getElementById('metricSelect').addEventListener('change', (e)=> setMetric(e.target.value));

function setChartMode(mode){
  state.chartMode = mode;
  document.getElementById('modeRaw').classList.toggle('active', mode==='raw');
  document.getElementById('modeGrowth').classList.toggle('active', mode==='growth');
  persist();
  renderChart();
}
document.getElementById('modeRaw').addEventListener('click', ()=> setChartMode('raw'));
document.getElementById('modeGrowth').addEventListener('click', ()=> setChartMode('growth'));

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `product-report-backup-${state.dates[state.dates.length-1]||'data'}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed.products || !parsed.dates || !parsed.data){ alert('올바른 백업 파일이 아닙니다.'); return; }
      state = parsed;
      if(!state.selectedProduct){
        state.selectedProduct = (state.selectedProducts && state.selectedProducts[0]) || state.products[0];
      }
      delete state.selectedProducts;
      if(!state.metric) state.metric = 'likes';
      if(!state.chartMode) state.chartMode = 'raw';
      await persist(true);
      renderAll();
      alert('백업을 불러왔습니다.');
    }catch(err){ alert('파일을 읽는 중 오류가 발생했습니다.'); }
  };
  reader.readAsText(file);
});

/* ---------- Init ---------- */
function renderReportDate(){
  const el = document.getElementById('reportDate');
  if(!el) return;
  try{
    // 접속 시점의 한국 시간(Asia/Seoul) 기준 날짜를 매번 새로 계산한다 (고정값 아님).
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'
    }).formatToParts(new Date());
    const y = parts.find(p=>p.type==='year').value;
    const mo = parts.find(p=>p.type==='month').value;
    const da = parts.find(p=>p.type==='day').value;
    el.textContent = `(${y}.${mo}.${da})`;
  }catch(e){
    el.textContent = '';
  }
}

(async function init(){
  renderReportDate();
  await loadState();
  renderAll();
})();
</script>
</body>
</html>
